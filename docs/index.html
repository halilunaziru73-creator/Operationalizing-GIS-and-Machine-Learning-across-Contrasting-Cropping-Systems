<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operationalizing GIS & ML Across Cropping Systems — Graphical abstract</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --border: #e2e0d8; --text: #1a1a18;
    --text-secondary: #6b6a63; --accent-bg: #eaf1fb; --accent-text: #185fa5; --accent-border: #85b7eb;
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:2.5rem 1.5rem; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .metric { font-size: 14px; color: var(--text-secondary); margin: 0 0 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1.25rem; }
  .chip { font-size:12.5px; padding:7px 12px; border-radius:999px; border:1px solid var(--border);
    background:var(--bg); cursor:pointer; transition:.25s; color:var(--text); }
  .chip.active { background:var(--accent-bg); color:var(--accent-text); border-color:var(--accent-border); }
  .detail { background:var(--bg); border-radius:10px; padding:1rem 1.25rem; min-height:70px;
    display:flex; align-items:center; font-size:14.5px; line-height:1.6; }
  .back { display:inline-block; margin-top:1.5rem; font-size:13px; color:var(--accent-text); text-decoration:none; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171715; --card:#201f1c; --border:#37362f; --text:#eceae2; --text-secondary:#9c9a92;
      --accent-bg:#0c447c; --accent-text:#b5d4f4; --accent-border:#185fa5; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Operationalizing GIS & ML Across Cropping Systems</h1>
  <p class="metric">3 cropping systems compared</p>
  <div class="card">
    <div class="chips" id="chips"></div>
    <div class="detail" id="detail"></div>
  </div>
  <a class="back" href="../README.md">&larr; Back to README</a>
</div>
<script>
const steps = [{"t": "3 independent field campaigns", "d": "Principle: synthesise separate case studies (maize, vineyard pest, ripening) into one comparative framework."}, {"t": "Interpolation & vegetation indices", "d": "Principle: IDW, Thiessen tessellation and multispectral indices turn point samples into continuous surfaces."}, {"t": "Site-specific regression models", "d": "Principle: each system gets the regression form that fits its data (quadratic yield, logarithmic ripening, etc.)."}, {"t": "Cross-system synthesis", "d": "Principle: compare what worked across systems to find transferable lessons, not just report each site separately."}, {"t": "Operational recommendations", "d": "Principle: translate each model into a concrete action \u2014 variable-rate lime, pest-trap timing, harvest date."}];
let idx = 0;
let timer = null;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function render() {
  const chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = '';
  steps.forEach((s, i) => {
    const c = document.createElement('button');
    c.className = 'chip' + (i === idx ? ' active' : '');
    c.textContent = (i+1) + '. ' + s.t;
    c.onclick = () => { idx = i; render(); resetTimer(); };
    chipsEl.appendChild(c);
  });
  document.getElementById('detail').textContent = steps[idx].d;
}

function tick() { idx = (idx + 1) % steps.length; render(); }
function resetTimer() { if (timer) clearInterval(timer); if (!reduceMotion) timer = setInterval(tick, 2200); }

render();
resetTimer();
</script>
</body>
</html>
